<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <style>
      .bg-console { fill: #15130f; }
      .bg-paper { fill: #f6f1e7; }
      .text-cream { fill: #e8e2d0; font-family: 'IBM Plex Mono', monospace; }
      .text-paper-title { fill: #f6f1e7; font-family: 'Newsreader', Georgia, serif; }
      .text-sub { fill: #8a8272; font-family: 'IBM Plex Mono', monospace; }
      .stamp-red-ink { fill: #9c2b1f; stroke: #9c2b1f; }
    </style>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(10, 10)">
    <!-- Terminal Pane (Left half of mark) -->
    <rect x="0" y="0" width="50" height="100" class="bg-console" rx="3" />
    <!-- Terminal dots -->
    <circle cx="10" cy="12" r="2" fill="#3a362c" />
    <circle cx="17" cy="12" r="2" fill="#3a362c" />
    <circle cx="24" cy="12" r="2" fill="#3a362c" />
    <!-- Console Content -->
    <text x="8" y="34" font-size="12" font-weight="700" class="text-cream">$</text>
    <text x="18" y="34" font-size="9" class="text-cream" fill-opacity="0.75">xml</text>
    <rect x="8" y="44" width="28" height="3" fill="#9c2b1f" />
    <rect x="8" y="53" width="20" height="2" fill="#8a8272" opacity="0.6" />
    <rect x="8" y="60" width="30" height="2" fill="#8a8272" opacity="0.6" />
    <rect x="8" y="67" width="16" height="2" fill="#8a8272" opacity="0.6" />
    <!-- Prompt Cursor -->
    <rect x="8" y="78" width="6" height="10" fill="#e8e2d0" />

    <!-- Perforation line seam -->
    <line x1="50" y1="0" x2="50" y2="100" stroke="#8a8272" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Paper Pane (Right half of mark) -->
    <rect x="50" y="0" width="50" height="100" class="bg-paper" rx="3" />
    <!-- Paper Header & Table Lines -->
    <rect x="58" y="14" width="34" height="4" fill="#211d16" />
    <line x1="58" y1="28" x2="92" y2="28" stroke="#8a8272" stroke-width="1" />
    <line x1="58" y1="38" x2="92" y2="38" stroke="#8a8272" stroke-width="1" stroke-dasharray="1,1" />
    <line x1="58" y1="48" x2="92" y2="48" stroke="#8a8272" stroke-width="1" stroke-dasharray="1,1" />
    <line x1="58" y1="58" x2="92" y2="58" stroke="#211d16" stroke-width="1.5" />

    <!-- Rubber Ink Stamp "ACEPTADA / CDR 0" -->
    <g transform="translate(75, 75) rotate(-11)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#9c2b1f" stroke-width="1.8" stroke-dasharray="10,2,3,2" />
      <circle cx="0" cy="0" r="15" fill="none" stroke="#9c2b1f" stroke-width="0.9" />
      <text x="0" y="-4" font-family="'IBM Plex Mono', monospace" font-size="6" font-weight="700" fill="#9c2b1f" text-anchor="middle" letter-spacing="0.5">SUNAT</text>
      <text x="0" y="3.5" font-family="'IBM Plex Mono', monospace" font-size="4.8" font-weight="700" fill="#9c2b1f" text-anchor="middle" letter-spacing="0.3">ACEPTADA</text>
      <text x="0" y="10.5" font-family="'IBM Plex Mono', monospace" font-size="4" fill="#9c2b1f" text-anchor="middle">CDR 0</text>
    </g>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(120, 32)">
    <text x="0" y="24" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="26" font-weight="500" fill="#f6f1e7" letter-spacing="-0.3">Facturación Electrónica</text>
    <text x="0" y="50" font-family="'IBM Plex Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#9c2b1f" letter-spacing="2.5">SUNAT <tspan fill="#8a8272" font-weight="400" font-size="11" letter-spacing="1">· SKILL &amp; TS ENGINE</tspan></text>
  </g>
</svg>
